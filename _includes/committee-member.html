<div class="committee-member" itemscope itemtype="https://schema.org/Person">
        <div class="author__avatar committee-member__avatar">
          {% if include.picture %}
          <img src="{{ include.picture | relative_url }}" alt="{{ include.name }}" itemprop="image" width="104" height="104" loading="lazy">
          {% else %}
          <div class="author__avatar-placeholder" aria-hidden="true">{{ include.initials }}</div>
          {% endif %}
        </div>
        <div class="author__content">
          <h2 class="author__name" itemprop="name">
            {% if include.site == null %}{{ include.name }}{% else %}<a href="{{ include.site }}">{{ include.name }}</a>{% endif %}
            {% if include.extrainfo != null %}<em>{{ include.extrainfo }}</em>{% endif %}
          </h2>
          <p class="author__bio" itemprop="description">{{ include.institution }}</p>
          <p class="author__bio"><a href="mailto:{{ include.email }}" itemprop="email">{{ include.email }}</a></p>
        </div>
</div>
